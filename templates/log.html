{% extends "base.html" %}

{% block page_title %}日志 — dTools{% endblock %}

{% block page_style %}
<style>
  /* 头部 */
  .hdr {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; gap: 12px; flex-wrap: wrap;
  }
  .hdr h1 { font-size: 20px; font-weight: 600; }
  .hdr-actions { display: flex; gap: 8px; align-items: center; }
  .hdr-actions .btn.active { background: var(--a); color: #fff; border-color: var(--a); }

  /* 搜索栏（继承 .ui-input） */
  .search-bar {
    display: flex; gap: 8px; align-items: center; margin-bottom: 12px;
  }
  .search-input { flex: 1; }

  /* 统计 */
  .stats {
    display: flex; gap: 16px; font-size: 12px; color: var(--t2); margin-bottom: 12px;
  }
  .stats .count { font-weight: 600; color: var(--t); }

  /* 级别筛选（继承 .ui-chip） */
  .level-filters { display: flex; gap: 4px; }
  .level-btn.act { color: #fff; border-color: transparent; }
  .level-btn.act[data-level="info"] { background: var(--info); }
  .level-btn.act[data-level="ok"] { background: var(--ok); }
  .level-btn.act[data-level="warn"] { background: var(--warn); }
  .level-btn.act[data-level="err"] { background: var(--err); }

  /* 日志容器（继承 .ui-panel） */
  .log-container { overflow: hidden; }
  .log-list {
    height: calc(100vh - 260px); min-height: 300px;
    overflow-y: auto; padding: 8px 0;
    font-size: 13px; line-height: 1.6;
  }

  /* 日志条目 */
  .log-entry {
    display: flex; gap: 8px; padding: 3px 14px;
    transition: background .1s;
  }
  .log-entry:hover { background: var(--s2); }
  .log-time {
    color: var(--t3); font-size: 12px; flex-shrink: 0;
    font-family: var(--mono); min-width: 64px;
  }
  .log-level {
    flex-shrink: 0; width: 6px; border-radius: 3px; margin-top: 7px; height: 6px;
  }
  .log-level.info { background: var(--info); }
  .log-level.ok { background: var(--ok); }
  .log-level.warn { background: var(--warn); }
  .log-level.err { background: var(--err); }
  .log-source {
    color: var(--a); font-size: 11px; flex-shrink: 0; min-width: 40px;
    font-weight: 600; margin-top: 1px;
  }
  .log-msg { flex: 1; word-break: break-all; }

  /* 搜索高亮 */
  .log-container mark {
    background: color-mix(in srgb, var(--warn) 30%, transparent); color: var(--t);
    border-radius: 2px; padding: 0 1px;
  }

  /* 空状态 */
  .empty {
    text-align: center; padding: 60px 20px; color: var(--t3); font-size: 14px;
  }

  @media (max-width: 600px) {
    .hdr { flex-direction: column; align-items: flex-start; }
    .log-source { display: none; }
  }
</style>
{% endblock %}

{% block content %}
<div class="page-content">
  <div class="hdr">
    <h1>日志</h1>
    <div class="hdr-actions">
      <button class="btn" id="autoScrollBtn" onclick="toggleAutoScroll()">自动滚动</button>
      <button class="btn" id="themeBtn" onclick="toggleTheme()">切换主题</button>
      <button class="btn" onclick="clearLogs()">清空</button>
    </div>
  </div>

  <div class="search-bar">
    <input class="ui-input search-input" id="searchInput" placeholder="搜索日志内容..." oninput="renderLogs()">
    <div class="level-filters">
      <div class="ui-chip level-btn act" data-level="info" onclick="toggleLevel(this)">信息</div>
      <div class="ui-chip level-btn act" data-level="ok" onclick="toggleLevel(this)">成功</div>
      <div class="ui-chip level-btn act" data-level="warn" onclick="toggleLevel(this)">警告</div>
      <div class="ui-chip level-btn act" data-level="err" onclick="toggleLevel(this)">错误</div>
    </div>
  </div>

  <div class="stats">
    <span>共 <span class="count" id="totalCount">0</span> 条</span>
    <span>匹配 <span class="count" id="matchCount">0</span> 条</span>
  </div>

  <div class="ui-panel log-container">
    <div class="log-list" id="logList">
      <div class="empty">暂无日志，等待操作...</div>
    </div>
  </div>
</div>
{% endblock %}

{% block page_script %}
<script>
const $ = id => document.getElementById(id);
let logs = [];
let autoScroll = true;
let activeLevels = new Set(['info', 'ok', 'warn', 'err']);
let lastTs = 0;
let pollTimer = null;

/* 主题 */
function initTheme() {
  try {
    const saved = localStorage.getItem('csd-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  } catch {}
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('csd-theme', next); } catch {}
}

/* 自动滚动 */
function toggleAutoScroll() {
  autoScroll = !autoScroll;
  $('autoScrollBtn').classList.toggle('active', autoScroll);
}

/* 级别筛选 */
function toggleLevel(el) {
  const level = el.dataset.level;
  if (activeLevels.has(level)) {
    activeLevels.delete(level);
    el.classList.remove('act');
  } else {
    activeLevels.add(level);
    el.classList.add('act');
  }
  renderLogs();
}

/* 搜索高亮 */
function highlightText(text, query) {
  if (!query) return escHtml(text);
  const escaped = escHtml(text);
  const lower = escaped.toLowerCase();
  const keywords = query.toLowerCase().split(/\s+/).filter(Boolean);
  if (!keywords.length) return escaped;

  const ranges = [];
  keywords.forEach(kw => {
    let start = 0;
    while (true) {
      const idx = lower.indexOf(kw, start);
      if (idx < 0) break;
      ranges.push([idx, idx + kw.length]);
      start = idx + 1;
    }
  });

  if (!ranges.length) return escaped;

  ranges.sort((a, b) => a[0] - b[0]);
  const merged = [ranges[0]];
  for (let i = 1; i < ranges.length; i++) {
    const last = merged[merged.length - 1];
    if (ranges[i][0] <= last[1]) last[1] = Math.max(last[1], ranges[i][1]);
    else merged.push(ranges[i]);
  }

  let result = '', pos = 0;
  merged.forEach(([s, e]) => {
    result += escaped.substring(pos, s) + '<mark>' + escaped.substring(s, e) + '</mark>';
    pos = e;
  });
  result += escaped.substring(pos);
  return result;
}

function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* 渲染日志 */
function renderLogs() {
  const query = $('searchInput').value.trim();
  const list = $('logList');

  const filtered = logs.filter(e => {
    if (!activeLevels.has(e.level)) return false;
    if (query) {
      const q = query.toLowerCase();
      const text = (e.msg + ' ' + e.source).toLowerCase();
      if (!q.split(/\s+/).every(kw => text.includes(kw))) return false;
    }
    return true;
  });

  $('totalCount').textContent = logs.length;
  $('matchCount').textContent = filtered.length;

  if (!filtered.length) {
    list.innerHTML = '<div class="empty">' + (logs.length ? '无匹配日志' : '暂无日志，等待操作...') + '</div>';
    return;
  }

  list.innerHTML = filtered.map(e => {
    const msg = query ? highlightText(e.msg, query) : escHtml(e.msg);
    return '<div class="log-entry">' +
      '<span class="log-time">' + escHtml(e.time) + '</span>' +
      '<span class="log-level ' + e.level + '"></span>' +
      '<span class="log-source">' + escHtml(e.source) + '</span>' +
      '<span class="log-msg">' + msg + '</span>' +
    '</div>';
  }).join('');

  if (autoScroll) {
    list.scrollTop = list.scrollHeight;
  }
}

/* 增量轮询 */
async function pollLogs() {
  try {
    const r = await fetch('/api/logs/since?ts=' + lastTs);
    const newLogs = await r.json();
    if (newLogs.length) {
      logs.push(...newLogs);
      lastTs = newLogs[newLogs.length - 1].ts;
      renderLogs();
    }
  } catch {}
}

/* 清空日志 */
async function clearLogs() {
  try {
    await fetch('/api/logs/clear', { method: 'POST' });
    logs = [];
    lastTs = 0;
    renderLogs();
  } catch {}
}

/* 复制日志 */
async function copyLogs() {
  const query = $('searchInput').value.trim();
  const filtered = logs.filter(e => {
    if (!activeLevels.has(e.level)) return false;
    if (query) {
      const q = query.toLowerCase();
      const text = (e.msg + ' ' + e.source).toLowerCase();
      if (!q.split(/\s+/).every(kw => text.includes(kw))) return false;
    }
    return true;
  });
  const text = filtered.map(e => e.time + ' [' + e.level.toUpperCase() + '] [' + e.source + '] ' + e.msg).join('\n');
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
  }
}

/* 初始化 */
async function init() {
  initTheme();
  $('autoScrollBtn').classList.add('active');

  // 首次加载全部日志
  try {
    const r = await fetch('/api/logs');
    logs = await r.json();
    if (logs.length) {
      lastTs = logs[logs.length - 1].ts;
    }
    renderLogs();
  } catch {}

  // 每 2 秒增量轮询
  pollTimer = setInterval(pollLogs, 2000);
}

init();
</script>
{% endblock %}
